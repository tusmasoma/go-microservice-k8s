name: "Discover Go Services"
description: "Finds changed Go services and outputs matrix"
outputs:
  matrix:
    description: "JSON matrix of changed services"
    value: ${{ steps.set-matrix.outputs.matrix }}
runs:
  using: "composite"
  steps:
    - name: Find all service directories
      id: find-services
      shell: bash
      run: |
        services=$(find ./go/services -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)
        printf "all_services<<EOF\n%s\nEOF\n" "$services" >> "$GITHUB_ENV"

    - name: Diff and extract changed services
      id: set-matrix
      shell: bash
      run: |
        git fetch origin main

        diff_files=$(git diff --name-only origin/main...HEAD)
        changed_services=()

        for svc in $all_services; do
          if echo "$diff_files" | grep -q "go/services/$svc/"; then
            changed_services+=("$svc")
          fi
        done

        if [ ${#changed_services[@]} -eq 0 ]; then
          json='{"include":[]}'
        else
          json=$(printf "%s\n" "${changed_services[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0)) | {include: map({service: .})}')
        fi
        echo "matrix=$json" >> "$GITHUB_OUTPUT"