version: v2
modules:
  - path: .
    excludes:
      - vendor
deps:
  - buf.build/gogo/protobuf
lint:
  use:
    - ENUM_PASCAL_CASE
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - FIELD_LOWER_SNAKE_CASE
    - FILE_LOWER_SNAKE_CASE
    - MESSAGE_PASCAL_CASE
    - PACKAGE_SAME_GO_PACKAGE
    - RPC_PASCAL_CASE
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT