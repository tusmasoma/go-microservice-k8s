      description: Delete a customer by ID
      parameters:
      - description: Customer ID
        in: path
        name: customerID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Internal Server Error
      summary: Delete a customer
      tags:
      - customer
    get:
      description: Get customer information by ID
      parameters:
      - description: Customer ID
        in: path
        name: customerID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.GetCustomerResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Internal Server Error
      summary: Get a customer
      tags:
      - customer
    put:
      description: Update customer information by ID
      parameters:
      - description: Customer ID
        in: path
        name: customerID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/web.UpdateCustomerRequest'
        description: Updated customer information
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Internal Server Error
      summary: Update a customer
      tags:
      - customer
  /api/v1/order:
    get:
      description: Get a list of all orders with customer and catalog item details
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.ListOrdersResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Internal Server Error
      summary: List all orders
      tags:
      - order
    post:
      description: Create a new order with customer ID and order lines
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/web.CreateOrderRequest'
        description: Order data
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Internal Server Error
      summary: Create a new order
      tags:
      - order
  /api/v1/order/{orderID}:
    delete:
      description: Delete an order by ID
      parameters:
      - description: Order ID
        in: path
        name: orderID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Not Found
        "500":
          content:
            application/json:
