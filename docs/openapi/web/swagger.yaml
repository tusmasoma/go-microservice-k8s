components:
  schemas:
    timestamppb.Timestamp:
      properties:
        nanos:
          description: |-
            Non-negative fractions of a second at nanosecond resolution. Negative
            second values with fractions must still have non-negative nanos values
            that count forward in time. Must be from 0 to 999,999,999
            inclusive.
          type: integer
        seconds:
          description: |-
            Represents seconds of UTC time since Unix epoch
            1970-01-01T00:00:00Z. Must be from 0001-01-01T00:00:00Z to
            9999-12-31T23:59:59Z inclusive.
          type: integer
      type: object
    web.CatalogItem:
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
      type: object
    web.CountryCode:
      type: integer
      x-enum-varnames:
      - CountryCode_COUNTRY_CODE_UNSPECIFIED
      - CountryCode_USA
      - CountryCode_JPN
      - CountryCode_DEU
      - CountryCode_FRA
      - CountryCode_GBR
      - CountryCode_CAN
      - CountryCode_AUS
      - CountryCode_ITA
      - CountryCode_BRA
      - CountryCode_KOR
      - CountryCode_CHN
      - CountryCode_IND
      - CountryCode_MEX
      - CountryCode_RUS
      - CountryCode_ESP
      - CountryCode_NLD
      - CountryCode_SWE
      - CountryCode_CHE
      - CountryCode_ARG
      - CountryCode_ZAF
    web.CreateCatalogItemRequest:
      properties:
        name:
          type: string
        price:
          type: number
      type: object
    web.CreateCustomerRequest:
      properties:
        city:
          type: string
        country_code:
          type: integer
          x-enum-varnames:
          - CountryCode_COUNTRY_CODE_UNSPECIFIED
          - CountryCode_USA
          - CountryCode_JPN
          - CountryCode_DEU
          - CountryCode_FRA
          - CountryCode_GBR
          - CountryCode_CAN
          - CountryCode_AUS
          - CountryCode_ITA
          - CountryCode_BRA
          - CountryCode_KOR
          - CountryCode_CHN
          - CountryCode_IND
          - CountryCode_MEX
          - CountryCode_RUS
          - CountryCode_ESP
          - CountryCode_NLD
          - CountryCode_SWE
          - CountryCode_CHE
          - CountryCode_ARG
          - CountryCode_ZAF
        email:
          type: string
        name:
          type: string
        street:
          type: string
      type: object
    web.CreateOrderRequest:
      properties:
        customer_id:
          type: string
        order_lines:
          items:
            $ref: '#/components/schemas/web.OrderLine'
          type: array
          uniqueItems: false
      type: object
    web.Customer:
      properties:
        city:
          type: string
        country_code:
          $ref: '#/components/schemas/web.CountryCode'
        email:
          type: string
        id:
          type: string
        name:
          type: string
        street:
          type: string
      type: object
    web.Error:
      properties:
        message:
          type: string
      type: object
    web.GetCatalogItemResponse:
      properties:
        item:
          $ref: '#/components/schemas/web.CatalogItem'
      type: object
    web.GetCustomerResponse:
      properties:
        customer:
          $ref: '#/components/schemas/web.Customer'
      type: object
    web.GetOrderResponse:
      properties:
        order:
          $ref: '#/components/schemas/web.Order'
      type: object
    web.ListCatalogItemsByIDsRequest:
      properties:
        ids:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    web.ListCatalogItemsByIDsResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/web.CatalogItem'
          type: array
          uniqueItems: false
      type: object
    web.ListCatalogItemsByNameResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/web.CatalogItem'
          type: array
          uniqueItems: false
      type: object
    web.ListCatalogItemsResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/web.CatalogItem'
          type: array
          uniqueItems: false
      type: object
    web.ListCustomersResponse:
      properties:
        customers:
          items:
            $ref: '#/components/schemas/web.Customer'
          type: array
          uniqueItems: false
      type: object
    web.ListOrdersResponse:
      properties:
        orders:
          items:
            $ref: '#/components/schemas/web.Order'
          type: array
          uniqueItems: false
      type: object
    web.Order:
      properties:
        customer:
          $ref: '#/components/schemas/web.Customer'
        id:
          type: string
        order_date:
          $ref: '#/components/schemas/timestamppb.Timestamp'
        order_lines:
          items:
            $ref: '#/components/schemas/web.OrderLine'
          type: array
          uniqueItems: false
      type: object
    web.OrderLine:
      properties:
        catalog_item:
          $ref: '#/components/schemas/web.CatalogItem'
        quantity:
          type: integer
      type: object
    web.UpdateCatalogItemRequest:
      properties:
        name:
          type: string
        price:
          type: number
      type: object
    web.UpdateCustomerRequest:
      properties:
        city:
          type: string
        country_code:
          type: integer
          x-enum-varnames:
          - CountryCode_COUNTRY_CODE_UNSPECIFIED
          - CountryCode_USA
          - CountryCode_JPN
          - CountryCode_DEU
          - CountryCode_FRA
          - CountryCode_GBR
          - CountryCode_CAN
          - CountryCode_AUS
          - CountryCode_ITA
          - CountryCode_BRA
          - CountryCode_KOR
          - CountryCode_CHN
          - CountryCode_IND
          - CountryCode_MEX
          - CountryCode_RUS
          - CountryCode_ESP
          - CountryCode_NLD
          - CountryCode_SWE
          - CountryCode_CHE
          - CountryCode_ARG
          - CountryCode_ZAF
        email:
          type: string
        name:
          type: string
        street:
          type: string
      type: object
