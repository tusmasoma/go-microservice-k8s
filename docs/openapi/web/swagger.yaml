info:
  description: レポジトリのAPIドキュメントです。
  title: Web API
  version: "1.0"
openapi: 3.1.0
paths:
  /api/v1/catalog:
    get:
      description: Get a list of all catalog items
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.ListCatalogItemsResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Internal Server Error
      summary: List all catalog items
      tags:
      - catalog
    post:
      description: Create a new catalog item with name and price
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/web.CreateCatalogItemRequest'
        description: Catalog item data
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Internal Server Error
      summary: Create a new catalog item
      tags:
      - catalog
  /api/v1/catalog/{catalogItemID}:
    delete:
      description: Delete a catalog item by ID
      parameters:
      - description: Catalog Item ID
        in: path
        name: catalogItemID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Internal Server Error
      summary: Delete a catalog item
      tags:
      - catalog
    get:
      description: Get a catalog item by ID
      parameters:
      - description: Catalog Item ID
        in: path
        name: catalogItemID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.GetCatalogItemResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Internal Server Error
      summary: Get a catalog item
      tags:
      - catalog
    put:
      description: Update a catalog item by ID
      parameters:
      - description: Catalog Item ID
        in: path
        name: catalogItemID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/web.UpdateCatalogItemRequest'
        description: Updated catalog item data
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Internal Server Error
      summary: Update a catalog item
      tags:
      - catalog
  /api/v1/catalog/search/by-ids:
    post:
      description: Get multiple catalog items by their IDs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/web.ListCatalogItemsByIDsRequest'
        description: List of catalog item IDs
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.ListCatalogItemsByIDsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Internal Server Error
      summary: Get catalog items by IDs
      tags:
      - catalog
  /api/v1/catalog/search/by-name:
    get:
      description: Search catalog items by name
      parameters:
      - description: Item name to search
        in: query
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.ListCatalogItemsByNameResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.Error'
          description: Internal Server Error
      summary: Search catalog items by name
      tags:
      - catalog
  /api/v1/customer:
    get:
